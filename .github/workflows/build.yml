name: build

on: [push, pull_request]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libsdl2-dev libgl1-mesa-dev libjpeg-dev
      - name: configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_FLAGS="-Werror=implicit-function-declaration -Werror=return-type -Werror=incompatible-pointer-types -Werror=int-conversion -Werror=format-security"
      - name: build
        run: cmake --build build -j "$(nproc)"

  archlinux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: install dependencies
        run: pacman -Syu --noconfirm base-devel cmake git sdl2 libglvnd mesa libjpeg-turbo
      - uses: actions/checkout@v4
      - name: configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
